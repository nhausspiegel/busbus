name: Deploy debug map to GitHub Pages

on:
  push:
    branches: [main]
    # The service recorder commits every time its record moves, up to once an
    # hour. Redeploying the whole site for each of those would be most of the
    # deploys this repo ever does, for a file the app re-reads anyway. The
    # daily run below is what carries the accumulated record to the site.
    paths-ignore: ["public/service-history.json"]
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, not 20: jsdom's bundled undici calls
          # webidl.util.markAsUncloneable, which does not exist on Node 20, so
          # the component tests crashed the runner while passing locally.
          node-version: 22
          cache: npm
      - run: npm ci
      # Tests gate the deploy: a broken ranker must not reach the site.
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
